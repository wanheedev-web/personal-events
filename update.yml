name: update-events

on:
  schedule:
    - cron: "0 14 * * *"   # 매일 수집 (UTC 14시 = 벤쿠버 오전 6~7시)
    - cron: "0 16 * * 1"   # 매주 월요일 알림 (UTC 16시 = 벤쿠버 오전 8~9시)
  workflow_dispatch:
    inputs:
      task:
        description: "무엇을 실행할까요?"
        type: choice
        options: [both, scrape, digest]
        default: both

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 수집
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.task != 'digest') || github.event.schedule == '0 14 * * *' }}
        run: |
          python -m playwright install --with-deps chromium
          python -m src.build

      - name: events.json 커밋
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.task != 'digest') || github.event.schedule == '0 14 * * *' }}
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add docs/events.json docs/data.js
          git diff --staged --quiet || git commit -m "update events"
          git push

      - name: 주간 알림
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.task != 'scrape') || github.event.schedule == '0 16 * * 1' }}
        run: python -m src.digest
